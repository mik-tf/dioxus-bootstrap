[package]
name = "dioxus-bootstrap-css"
version = "0.5.14"
readme = "../../README.md"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Bootstrap 5.3 components for Dioxus — type-safe RSX wrappers powered by Bootstrap CSS"
repository = "https://forge.ourworld.tf/lhumina_code/dioxus-bootstrap-css"
keywords = ["dioxus", "bootstrap", "wasm", "ui", "components"]
categories = ["gui", "wasm", "web-programming"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
dioxus = { version = "0.7", default-features = false, features = ["macro", "html", "signals", "hooks", "document", "asset"] }
gloo-timers = { version = "0.4", features = ["futures"] }
# A <select>'s selection is its .value property / <option selected>, not a
# `value` content attribute, so Dioxus's declarative `value` never applies to a
# select. Select reflects the controlled value onto the DOM element imperatively.
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Element", "HtmlSelectElement"] }
