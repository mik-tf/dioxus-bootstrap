name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check, lint, format
    runs-on: docker
    container:
      image: ghcr.io/despiegk/builder:latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Setup toolchain and tools
        run: |
          set -euo pipefail
          if [ -f "$HOME/.cargo/env" ]; then
            source "$HOME/.cargo/env"
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

          retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              sleep $((attempt * 5))
            done
            "$@"
          }

          if ! rustup toolchain list | grep -Eq '^stable[^[:space:]]*'; then
            retry rustup toolchain install stable --profile minimal
          fi
          rustup default stable
          retry rustup component add --toolchain stable rustfmt clippy
          retry rustup target add --toolchain stable wasm32-unknown-unknown
          retry apt-get update
          retry apt-get install -y nodejs npm
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy library
        run: cargo clippy --target wasm32-unknown-unknown -p dioxus-bootstrap-css -- -D warnings
      - name: Clippy showcase
        run: cargo clippy --target wasm32-unknown-unknown -p showcase -- -D warnings
      - name: WASM check library
        run: cargo check --target wasm32-unknown-unknown -p dioxus-bootstrap-css
      - name: WASM check showcase
        run: cargo check --target wasm32-unknown-unknown -p showcase
      - name: Unit tests and doctests
        run: cargo test -p dioxus-bootstrap-css
      - name: Migration gate
        run: node tools/check-no-raw-bootstrap.mjs examples
      - name: Migration converter fixtures
        run: node tools/test-migrate-bootstrap-rsx.mjs

  msrv:
    name: MSRV 1.85
    runs-on: docker
    container:
      image: ghcr.io/despiegk/builder:latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust 1.85
        run: |
          set -euo pipefail
          if [ -f "$HOME/.cargo/env" ]; then
            source "$HOME/.cargo/env"
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

          retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              sleep $((attempt * 5))
            done
            "$@"
          }

          retry rustup toolchain install 1.85.0 --profile minimal
          retry rustup target add --toolchain 1.85.0 wasm32-unknown-unknown
      - name: Build on MSRV
        run: cargo +1.85.0 check --target wasm32-unknown-unknown -p dioxus-bootstrap-css
