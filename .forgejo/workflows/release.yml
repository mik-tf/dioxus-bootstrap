name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

jobs:
  publish:
    name: Publish crates.io
    runs-on: docker
    container:
      image: ghcr.io/despiegk/builder:latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Setup toolchain and tools
        run: |
          set -euo pipefail
          if [ -f "$HOME/.cargo/env" ]; then
            source "$HOME/.cargo/env"
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

          retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              sleep $((attempt * 5))
            done
            "$@"
          }

          if ! rustup toolchain list | grep -Eq '^stable[^[:space:]]*'; then
            retry rustup toolchain install stable --profile minimal
          fi
          rustup default stable
          retry rustup component add --toolchain stable rustfmt clippy
          retry rustup target add --toolchain stable wasm32-unknown-unknown
          retry apt-get update
          retry apt-get install -y nodejs npm jq curl
      - name: Verify release tag matches crate version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          crate="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "dioxus-bootstrap-css") | .version')"
          if [ "$tag" != "$crate" ]; then
            echo "Tag $tag does not match crate version $crate"
            exit 1
          fi
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy library
        run: cargo clippy --target wasm32-unknown-unknown -p dioxus-bootstrap-css -- -D warnings
      - name: WASM check library
        run: cargo check --target wasm32-unknown-unknown -p dioxus-bootstrap-css
      - name: Unit tests and doctests
        run: cargo test -p dioxus-bootstrap-css
      - name: Migration converter fixtures
        run: node tools/test-migrate-bootstrap-rsx.mjs
      - name: Migration gate
        run: node tools/check-no-raw-bootstrap.mjs examples
      - name: Dry-run publish
        run: cargo publish -p dioxus-bootstrap-css --dry-run
      - name: Check crates.io existing version
        id: published
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          if curl -s -H "User-Agent: dioxus-bootstrap-css-release" "https://crates.io/api/v1/crates/dioxus-bootstrap-css" | jq -e --arg v "$ver" 'any(.versions[]; .num == $v)' >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish crates.io
        if: steps.published.outputs.exists == 'false'
        run: cargo publish -p dioxus-bootstrap-css --token "$CARGO_REGISTRY_TOKEN"
