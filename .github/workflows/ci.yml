name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check, Lint & Format
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ci-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-ci-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (library)
        run: cargo clippy --target wasm32-unknown-unknown -p dioxus-bootstrap-css -- -D warnings

      - name: Clippy (showcase)
        run: cargo clippy --target wasm32-unknown-unknown -p showcase -- -D warnings

      - name: WASM build check (library)
        run: cargo check --target wasm32-unknown-unknown -p dioxus-bootstrap-css

      - name: WASM build check (showcase)
        run: cargo check --target wasm32-unknown-unknown -p showcase

      - name: Run tests
        run: cargo test -p dioxus-bootstrap-css

      - name: Migration gate (no raw Bootstrap / CDN / JS in examples)
        run: node tools/check-no-raw-bootstrap.mjs examples

      - name: Migration converter fixtures
        run: node tools/test-migrate-bootstrap-rsx.mjs

  msrv:
    name: MSRV (1.85)
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: wasm32-unknown-unknown

      - name: Build on MSRV
        run: cargo build --target wasm32-unknown-unknown -p dioxus-bootstrap-css
