name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check, Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ci-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-ci-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (library)
        run: cargo clippy --target wasm32-unknown-unknown -p dioxus-bootstrap-css -- -D warnings

      - name: Clippy (showcase)
        run: cargo clippy --target wasm32-unknown-unknown -p showcase -- -D warnings

      - name: WASM build check (library)
        run: cargo check --target wasm32-unknown-unknown -p dioxus-bootstrap-css

      - name: WASM build check (showcase)
        run: cargo check --target wasm32-unknown-unknown -p showcase

      - name: Run tests
        run: cargo test -p dioxus-bootstrap-css
